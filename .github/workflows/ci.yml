name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-api-jar
          path: target/*.jar

  docker:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t bookstore-api:${{ github.sha }} .

      - name: Start the container
        run: docker run -d --name api -p 8080:8080 bookstore-api:${{ github.sha }}

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health; then
              echo "Application is up."
              exit 0
            fi
            sleep 3
          done
          docker logs api
          exit 1

      - name: Verify /books returns data
        run: curl -fs http://localhost:8080/books
